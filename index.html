<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0c0e" />
<title>Black Cat Apps</title>
<meta name="description" content="レトロをテーマにしたスマホ向けPWAアプリ集" />
<link rel="icon" href="assets/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<style>
  :root {
    --bg-0: #0b0c0e;
    --bg-1: #16181b;
    --card: #1b1d21;
    --card-border: rgba(255, 255, 255, 0.07);
    --accent: #e6572e;
    --accent-2: #3b63d6;
    --text: #f1f1ef;
    --muted: #9196a0;
    --muted-2: #5e636c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(520px 320px at 50% -8%, rgba(230, 87, 46, 0.16), transparent 70%),
      radial-gradient(600px 400px at 85% 100%, rgba(59, 99, 214, 0.1), transparent 70%),
      var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }

  .logo-wrap {
    width: 92px;
    height: 92px;
    border-radius: 26px;
    padding: 3px;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02));
    box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.7);
    margin-bottom: 18px;
    animation: float 5s ease-in-out infinite;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 23px;
    display: block;
    object-fit: cover;
    background: #111214;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    text-align: center;
  }
  h1 .sub { color: var(--accent); }

  p.lead {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
    text-align: center;
    max-width: 300px;
  }

  .grid {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted-2);
    margin: 4px 2px 2px;
    font-weight: 700;
  }

.card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(165deg, var(--card), var(--bg-1));
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.6);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--card-accent, var(--accent));
  }
  a.card:active {
    transform: scale(0.98);
    box-shadow: 0 4px 12px -8px rgba(0, 0, 0, 0.6);
  }

  .icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    background: #101113;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }

  .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta .title { font-size: 15px; font-weight: 700; }
  .meta .desc {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    margin-left: auto;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--card-accent, var(--accent));
    border: 1px solid var(--card-accent, var(--accent));
    border-radius: 999px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .card-soon {
    border-style: dashed;
    opacity: 0.55;
    cursor: default;
  }
  .card-soon .icon { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
  .card-soon::before { background: var(--muted-2); }

  footer {
    margin-top: 44px;
    font-size: 11px;
    color: var(--muted-2);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo-wrap"><img src="assets/logo.png" alt="Black Cat Apps" /></div>
    <h1>BLACK CAT<span class="sub"> APPS</span></h1>
    <p class="lead">レトロなガジェットをモチーフにした、ブラウザで遊べるスマホ向けPWAコレクション。</p>
  </div>

  <div class="grid">
    <div class="section-label">APPS</div>

    <a class="card" href="apps/space-invaders/" style="--card-accent: #3ddc6f">
      <div class="icon">👾</div>
      <div class="meta">
        <div class="title">GALAXY SIEGE</div>
        <div class="desc">固定画面シューティングへのオマージュ</div>
      </div>
      <span class="badge">NEW</span>
    </a>

    <a class="card" href="apps/calculator-invader/" style="--card-accent: #3b63d6">
      <div class="icon">🧮</div>
      <div class="meta">
        <div class="title">電卓インベーダー</div>
        <div class="desc">CASIO SL-880風 電卓 × 撃墜ゲーム</div>
      </div>
    </a>

    <div class="card card-soon">
      <div class="icon">📟</div>
      <div class="meta">
        <div class="title">次のレトロアプリ</div>
        <div class="desc">近日公開</div>
      </div>
    </div>
  </div>

  <footer>&copy; Black Cat Apps — 非公式ファンメイド作品です</footer>
</body>
</html>
