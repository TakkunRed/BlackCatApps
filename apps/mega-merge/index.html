<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<title>MEGA MERGE</title>
<meta name="description" content="数字ブロックを下から撃って2倍に。隣と同じ数字なら合体してさらに倍。連鎖を繋げて2048を目指せ。" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="stage">
  <div class="cabinet">
    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="scoreVal">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HI-SCORE</span>
        <span class="hud-val" id="hiVal">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">SHOTS</span>
        <span class="hud-val" id="shotsVal">0</span>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="gameCanvas" aria-label="MEGA MERGE game screen"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">MEGA MERGE</div>
        <div class="overlay-sub" id="overlaySub">タップしてスタート</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnLeft" aria-label="left">◀</button>
      <button class="ctrl-btn ctrl-fire" id="btnFire" aria-label="fire">FIRE</button>
      <button class="ctrl-btn" id="btnRight" aria-label="right">▶</button>
    </div>

    <div class="secondary-controls">
      <button class="pill-btn" id="btnPause">⏸ PAUSE</button>
      <button class="pill-btn" id="btnSound">♪ SOUND</button>
    </div>
  </div>

  <p class="credit">
    MEGA MERGE はオリジナルのパズル×シューティングです。ブロックを撃って2倍にし、上下左右の同じ数字と連鎖合体させて2048を目指そう。画面を直接ドラッグして自機を操作することもできます。
  </p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
