<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<title>MEGA MERGE</title>
<meta name="description" content="数字ブロックをタップして2倍に。隣と同じ数字なら合体してさらに倍。最後の1個になるまでの最小ショット数の自己ベストを更新しよう。" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="stage">
  <div class="cabinet">
    <div class="size-select" id="sizeSelect">
      <button class="size-btn" data-rows="4" data-cols="4">
        <span class="size-label">4×4</span>
        <span class="size-best">--</span>
      </button>
      <button class="size-btn" data-rows="5" data-cols="5">
        <span class="size-label">5×5</span>
        <span class="size-best">--</span>
      </button>
      <button class="size-btn" data-rows="6" data-cols="6">
        <span class="size-label">6×6</span>
        <span class="size-best">--</span>
      </button>
    </div>

    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="scoreVal">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">BEST</span>
        <span class="hud-val" id="bestVal">--</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">SHOTS</span>
        <span class="hud-val" id="shotsVal">0</span>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="gameCanvas" aria-label="MEGA MERGE game screen"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">MEGA MERGE</div>
        <div class="overlay-sub" id="overlaySub">タップしてスタート</div>
      </div>
    </div>

    <p class="hint">消したいブロックを直接タップ/クリック(またはキーボードの数字キー 1〜6)。前後左右で同じ数字が揃うと一気に合体</p>

    <div class="secondary-controls">
      <button class="pill-btn" id="btnPause">⏸ PAUSE</button>
      <button class="pill-btn" id="btnSound">♪ SOUND</button>
    </div>
  </div>

  <p class="credit">
    MEGA MERGE はオリジナルのパズルです。ブロックを直接タップして2倍にし、上下左右で同じ数字が揃えば一気に合体。盤面を最後の1個になるまで集約しよう(2048を超えても消えません)。弾数制限は無いので、何発使っても必ずクリアできます。目指すのは「自己ベストの更新」、つまりできるだけ少ないショット数でクリアすることです。
  </p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
