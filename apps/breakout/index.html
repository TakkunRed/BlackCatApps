<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<title>BRICK BLITZ</title>
<meta name="description" content="古典的なブロック崩しへのオマージュ。パドルでボールを操り、ブロックを全て壊せ。" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="stage">
  <div class="cabinet">
    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="scoreVal">0000</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HI-SCORE</span>
        <span class="hud-val" id="hiVal">0000</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LEVEL</span>
        <span class="hud-val" id="levelVal">1</span>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="gameCanvas" aria-label="BRICK BLITZ game screen"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">BRICK BLITZ</div>
        <div class="overlay-sub" id="overlaySub">タップしてスタート</div>
      </div>
      <div class="lives" id="livesRow" aria-label="lives"></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnLeft" aria-label="left">◀</button>
      <button class="ctrl-btn ctrl-fire" id="btnFire" aria-label="launch">LAUNCH</button>
      <button class="ctrl-btn" id="btnRight" aria-label="right">▶</button>
    </div>

    <div class="secondary-controls">
      <button class="pill-btn" id="btnPause">⏸ PAUSE</button>
      <button class="pill-btn" id="btnSound">♪ SOUND</button>
    </div>
  </div>

  <p class="credit">
    ※本アプリは1976年の古典的なブロック崩しゲームへのオマージュとして独自に実装した非公式ファンメイド作品です。特定の商標は使用していません。画面を直接ドラッグしてパドルを操作することもできます。
  </p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
