<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<title>SNAKE BYTE</title>
<meta name="description" content="古典的なスネークゲームへのオマージュ。食べ物を取って伸びていく、壁と自分の体には要注意。" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="stage">
  <div class="cabinet">
    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="scoreVal">0000</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HI-SCORE</span>
        <span class="hud-val" id="hiVal">0000</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LENGTH</span>
        <span class="hud-val" id="lenVal">4</span>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="gameCanvas" aria-label="SNAKE BYTE game screen"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">SNAKE BYTE</div>
        <div class="overlay-sub" id="overlaySub">タップしてスタート</div>
      </div>
    </div>

    <div class="dpad">
      <button class="dpad-btn dpad-up" id="btnUp" aria-label="up">▲</button>
      <button class="dpad-btn dpad-left" id="btnLeft" aria-label="left">◀</button>
      <button class="dpad-btn dpad-right" id="btnRight" aria-label="right">▶</button>
      <button class="dpad-btn dpad-down" id="btnDown" aria-label="down">▼</button>
    </div>

    <div class="secondary-controls">
      <button class="pill-btn" id="btnPause">⏸ PAUSE</button>
      <button class="pill-btn" id="btnSound">♪ SOUND</button>
    </div>
  </div>

  <p class="credit">
    ※本アプリは古典的なスネークゲームへのオマージュとして独自に実装した非公式ファンメイド作品です。特定の商標は使用していません。画面をスワイプして方向を変えることもできます。
  </p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
